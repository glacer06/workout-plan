<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#f6f3ec">
<link rel="apple-touch-icon" sizes="180x180" href="/icon-nick-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-nick-192.png">
<link rel="manifest" href="/manifest-nick.webmanifest">
<title>Pair Fitness</title>
<style>
  html, body { margin: 0; background: #f6f3ec; color: #15130f; font-family: system-ui, -apple-system, sans-serif; }
  @media (prefers-color-scheme: dark) { body { background: #12110f; color: #efeae0; } }
  #boot { padding: 48px 20px; font-size: 15px; }
  a { color: inherit; }
</style>
</head>
<body>
<!-- The old fitness.nicksims.co loader, now a redirect to app.pair.fitness (NSI-942). The script below is the same in index.html and 404.html (redirect.test.mjs checks it). -->
<div id="boot">Pair Fitness has a new address. Taking you there. If nothing happens, <a href="https://app.pair.fitness/">open app.pair.fitness</a>.</div>
<script>(function(){var NEW='app.pair.fitness';try{if(location.hostname===NEW)return;var p=location.pathname;if(p==='/index.html'||p==='/404.html')p='/';location.replace('https://'+NEW+p+location.search+location.hash);}catch(e){}})();</script>
</body>
</html>
